name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The demo data is not a committed blob: the real pipeline regenerates it here on
      # every deploy, so what the public demo shows always matches the code in this commit.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run pipeline and self-test (fails the deploy if accuracy regresses)
        run: python scripts/selftest.py
        working-directory: backend
      - name: Export static data for the no-backend demo
        run: python scripts/export_static.py
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build static demo
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /thermal-sentinel/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
